<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>基礎工事 作業日報</title>
<style>
:root{--bg:#f4f1ea;--card:#fff;--tx:#222;--sub:#6b6b6b;--ac:#e8730c;--acx:#fff;--bd:#ddd6c8;--chip:#efe9dc;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a1a1a;--card:#262626;--tx:#f0f0f0;--sub:#a0a0a0;--ac:#ff9a3c;--acx:#1a1a1a;--bd:#3a3a3a;--chip:#333}}
:root[data-theme="dark"]{--bg:#1a1a1a;--card:#262626;--tx:#f0f0f0;--sub:#a0a0a0;--ac:#ff9a3c;--acx:#1a1a1a;--bd:#3a3a3a;--chip:#333}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;font-size:17px;line-height:1.5;padding-bottom:40px}
header{padding:16px 16px 4px}
h1{font-size:22px;margin:0}
header p{margin:2px 0 0;color:var(--sub);font-size:13px}
.wrap{max-width:560px;margin:0 auto;padding:0 12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin:12px 0}
.card h2{font-size:15px;margin:0 0 10px;color:var(--ac)}
label{display:block;font-size:13px;color:var(--sub);margin:10px 0 4px}
label:first-of-type{margin-top:0}
input,textarea{width:100%;font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:11px;min-height:46px}
textarea{min-height:90px;resize:vertical}
.row{display:flex;gap:8px}.row>*{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--bd);background:var(--chip);color:var(--tx);border-radius:999px;padding:10px 14px;font:inherit;font-size:15px;min-height:44px}
.chip.on{background:var(--ac);color:var(--acx);border-color:var(--ac);font-weight:700}
.step{display:flex;align-items:center;gap:12px}
.step button{width:52px;height:48px;border-radius:12px;border:1px solid var(--bd);background:var(--chip);color:var(--tx);font-size:26px}
.step b{font-size:26px;min-width:48px;text-align:center}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:15px;font:inherit;font-weight:700;background:var(--ac);color:var(--acx);margin-top:8px;min-height:50px}
.btn.s{background:var(--chip);color:var(--tx);border:1px solid var(--bd)}
.hi{padding:12px;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center;gap:8px}
.hi:last-child{border:0}
.hi span{font-size:14px}.hi small{color:var(--sub);display:block}
.hi button{background:none;border:0;color:var(--sub);font-size:20px;padding:8px}
.lh{margin:14px 0 4px;font-size:15px;font-weight:700}.lr{display:flex;align-items:center;gap:10px;padding:4px 0;border-bottom:1px solid var(--bd)}.lr span{width:62px;font-size:15px}.lr button{width:52px;height:46px;border-radius:12px;border:1px solid var(--bd);background:var(--chip);color:var(--tx);font-size:24px}.lr b{width:30px;text-align:center;font-size:22px}.lr em{font-style:normal;font-size:20px;color:var(--ac);letter-spacing:2px}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#222;color:#fff;padding:10px 18px;border-radius:999px;opacity:0;transition:.3s;pointer-events:none;font-size:15px}
#toast.show{opacity:.95}
</style>
</head>
<body>
<header class="wrap"><h1>🏗️ 作業日報</h1><p>基礎工事用｜タップ中心で入力 → コピーしてLINE・メールへ</p></header>
<div class="wrap">

<div class="card"><h2>基本情報</h2>
<label>日付</label><input type="date" id="date">
<label>現場名</label><div class="chips" id="sites" style="margin-bottom:8px"></div><input id="site" placeholder="新しい現場は入力（次から選べます）" autocomplete="off">
<label>天気</label><div class="chips" id="weather"></div>
<div class="row"><div><label>開始</label><input type="time" id="start"></div><div><label>終了</label><input type="time" id="end"></div></div>
<label>作業人数</label><div class="step"><button data-w="-1">−</button><b id="wn">0</b><span>人</span><button data-w="1">＋</button></div>
</div>

<div class="card"><h2>今日の作業（複数選択）</h2><div class="chips" id="tasks"></div>
<label>使用車両（使ったものをタップ）</label><div class="chips" id="veh"></div></div>

<div class="card"><h2>👷 出勤者（タップ：終日→午前→午後→外す）</h2><div class="chips" id="crew"></div>
<div class="row" style="margin-top:10px"><input id="pn" placeholder="名前を入力" autocomplete="off"><button class="btn s" id="addp" style="margin-top:0;flex:0 0 96px">＋追加</button></div><button class="btn s" id="delp">🗑 名簿を整理（押すと削除モード）</button></div>
<div class="card"><h2>🚛 搬入・搬出（＋−で正の字）</h2><div id="loads"></div></div>
<div class="card"><h2>数量・進捗</h2>
<div class="row"><div><label>生コン (m³)</label><input type="number" inputmode="decimal" id="conc" placeholder="0"></div><div><label>鉄筋 (kg)</label><input type="number" inputmode="decimal" id="rebar" placeholder="0"></div></div>

<label>作業内容・メモ</label><textarea id="memo" placeholder="例：A通り 耐圧盤配筋完了。B通りは明日。"></textarea></div>

<div class="card"><h2>連絡事項</h2>

<label>明日の予定</label><textarea id="tomorrow" placeholder="例：配筋検査、型枠建て込み"></textarea></div>

<div class="card"><h2>📷 写真</h2><input type="file" id="pick" accept="image/*" multiple hidden>
<button class="btn s" id="pickb" style="margin-top:0">📷 写真を撮る・選ぶ <span id="phn"></span></button>
<div id="phs" style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px"></div>
<p style="font-size:12px;color:var(--sub);margin:8px 0 0">写真は保存されません。日報を作って「写真つきで送る」で送ってから閉じてください。</p></div>
<button class="btn" id="make">📝 日報を作る</button>

<div class="card" id="out" hidden><h2>できあがり</h2>
<textarea id="txt" style="min-height:260px"></textarea>
<button class="btn" id="line" style="background:#06c755;color:#fff">💬 LINEで送る</button>
<button class="btn s" id="copy">📋 コピー</button>
<button class="btn s" id="share">📤 写真つきで送る（共有）</button>
<button class="btn s" id="save">💾 履歴に保存</button></div>

<div class="card"><h2>履歴</h2><div id="hist"><span style="color:var(--sub);font-size:14px">まだありません</span></div>
<button class="btn s" id="new">🆕 新しい日報（現場名は残す）</button></div>
</div>
<div id="toast"></div>
<script>
var OPT={weather:["☀️晴れ","⛅くもり","🌧️雨","❄️雪","💨強風"],
tasks:["地縄・丁張り","根切り(掘削)","砕石敷き","転圧","防湿シート","捨てコン","墨出し","型枠","配筋","配筋検査","アンカーボルト","コンクリート打設","養生","脱型","埋め戻し","残土処分","清掃・片付け"],
machines:["バックホー","ダンプ","ランマー","プレート","ポンプ車","ミキサー車","バイブレーター","レッカー"]};
var VEH=[{n:"4t",v:2},{n:"3t①",v:1.5},{n:"3t②",v:1.5},{n:"軽トラ①",v:0},{n:"軽トラ②",v:0}];
var ITEMS=[["sand","🪨 砕石（搬入）"],["soil","🟫 残土処分（搬出）"],["oth","📦 その他資材"]];
function L0(){return{sand:[0,0,0,0,0],soil:[0,0,0,0,0],oth:[0,0,0,0,0]}}
var multi={tasks:1,machines:1,crew:1,veh:1,weather:1};OPT.crew=ld("nippo_crew",[]);OPT.veh=VEH.map(function(v){return v.n}).concat(["バックホー3t","バックホー3.5t","バックホーCAT"]);
var S={date:"",site:"",weather:[],start:"",end:"",workers:0,tasks:[],machines:[],veh:[],crew:[],part:{},loads:L0(),conc:"",rebar:"",prog:"",memo:"",hiyari:"",tomorrow:""};
var $=function(i){return document.getElementById(i)};
function ld(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function sv(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function toast(t){var e=$("toast");e.textContent=t;e.className="show";setTimeout(function(){e.className=""},1600)}
function today(){var d=new Date();return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2)}
function draft(){sv("nippo_draft",S)}
function chips(id){var box=$(id);box.innerHTML="";OPT[id].forEach(function(o){var b=document.createElement("button");b.type="button";b.className="chip";b.textContent=o;
 b.onclick=function(){if(id==="crew"){cyc(o)}else if(multi[id]){var a=S[id],i=a.indexOf(o);i<0?a.push(o):a.splice(i,1)}else{S[id]=S[id]===o?"":o}draft();paint()};box.appendChild(b)})}
function paint(){S.crew=S.crew||[];S.veh=S.veh||[];S.part=S.part||{};if(!Array.isArray(S.weather))S.weather=S.weather?[S.weather]:[];["weather","tasks","veh","crew"].forEach(function(id){var bs=$(id).children;for(var i=0;i<bs.length;i++){var o=OPT[id][i],on=multi[id]?S[id].indexOf(o)>=0:S[id]===o;bs[i].className="chip"+(on?" on":"");bs[i].textContent=(id==="crew"&&on)?o+"（"+(S.part[o]||"終日")+"）":o}});$("wn").textContent=S.workers;drawLoads()}
var F=["date","site","start","end","conc","rebar","memo","tomorrow"];
function fill(){F.forEach(function(k){$(k).value=S[k]||""});paint();drawSites()}
F.forEach(function(k){$(k).addEventListener("input",function(){S[k]=this.value;draft()})});
document.querySelectorAll("[data-w]").forEach(function(b){b.onclick=function(){S.workers=Math.max(0,S.workers+Number(b.dataset.w));draft();paint()}});
["weather","tasks","veh","crew"].forEach(chips);
function cyc(o){S.part=S.part||{};if(DEL){OPT.crew.splice(OPT.crew.indexOf(o),1);sv("nippo_crew",OPT.crew);S.crew=S.crew.filter(function(x){return x!==o});delete S.part[o];chips("crew");return}var i=S.crew.indexOf(o);if(i<0){S.crew.push(o);delete S.part[o]}else{var p=S.part[o]||"終日";if(p==="終日")S.part[o]="午前";else if(p==="午前")S.part[o]="午後";else{S.crew.splice(i,1);delete S.part[o]}}}
var SITES=ld("nippo_sites",[]);
function drawSites(){var b=$("sites");b.innerHTML="";SITES.forEach(function(s){var c=document.createElement("button");c.type="button";c.className="chip"+(S.site===s?" on":"");c.textContent=s;c.onclick=function(){S.site=s;$("site").value=s;draft();drawSites()};b.appendChild(c)})}
function addSite(){var s=(S.site||"").trim();if(s&&SITES.indexOf(s)<0){SITES.push(s);sv("nippo_sites",SITES);drawSites()}}
function tally(n){var s="";for(var i=0;i<Math.floor(n/5);i++)s+="正";return s+["","一","丅","下","止"][n%5]}
function tot(a){var t=0;a.forEach(function(n,i){t+=n*VEH[i].v});return Math.round(t*10)/10}
function drawLoads(){var b=$("loads");S.loads=Object.assign(L0(),S.loads||{});var h="";
 ITEMS.forEach(function(it){var a=S.loads[it[0]];h+='<div class="lh">'+it[1]+'　計 '+tot(a)+' m³</div>';
  VEH.slice(0,3).forEach(function(v,i){var d='data-k="'+it[0]+'" data-i="'+i+'" data-d="';h+='<div class="lr"><span>'+v.n+'</span><button '+d+'-1">−</button><b>'+a[i]+'</b><button '+d+'1">＋</button><em>'+tally(a[i])+'</em></div>'})});
 b.innerHTML=h}
$("loads").onclick=function(e){var t=e.target;if(!t.dataset.d)return;var a=S.loads[t.dataset.k],i=+t.dataset.i;a[i]=Math.max(0,a[i]+(+t.dataset.d));draft();drawLoads()};
$("addp").onclick=function(){var n=$("pn").value.trim();if(!n||OPT.crew.indexOf(n)>=0)return;OPT.crew.push(n);sv("nippo_crew",OPT.crew);S.crew.push(n);$("pn").value="";chips("crew");draft();paint();toast(n+" を追加");};
var DEL=false;$("delp").onclick=function(){DEL=!DEL;this.textContent=DEL?"✅ 削除モード中（名前を押すと削除・ここを押すと終了）":"🗑 名簿を整理（押すと削除モード）";toast(DEL?"消したい名前をタップ":"通常に戻しました")};
function fd(s){if(!s)return"";var p=s.split("-"),d=new Date(s+"T00:00:00");return p[0]+"年"+Number(p[1])+"月"+Number(p[2])+"日（"+"日月火水木金土".charAt(d.getDay())+"）"}
function build(){var L=[];L.push("【作業日報】"+fd(S.date));
 if(S.site)L.push("現場：" + S.site);
 var w=[];if(S.weather&&S.weather.length)w.push("天気："+S.weather.join("、"));if(S.start||S.end)w.push("時間："+(S.start||"")+"〜"+(S.end||""));if(S.workers||S.crew.length)w.push("人数："+(S.workers||S.crew.length)+"名");
 if(w.length)L.push(w.join("　"));
 if(S.crew.length)L.push("出勤："+S.crew.map(function(n){return n+(S.part&&S.part[n]?"（"+S.part[n]+"）":"")}).join("、"));
 if(S.tasks.length){L.push("");L.push("■作業内容");S.tasks.forEach(function(t){L.push("・"+t)})}
 
 var u=S.veh.slice();ITEMS.forEach(function(it){S.loads[it[0]].forEach(function(c,i){if(c&&u.indexOf(VEH[i].n)<0)u.push(VEH[i].n)})});if(u.length)L.push("使用車両："+u.join("、"));
 var ld2=[];ITEMS.forEach(function(it){var a=S.loads[it[0]],p=[],n=0;a.forEach(function(c,i){if(c){p.push(VEH[i].n+" "+c+"回");n+=c}});if(n)ld2.push("・"+it[1].replace(/^\S+ /,"")+"："+p.join("、")+(tot(a)>0?"（計"+tot(a)+"m³）":""))});
 if(ld2.length){L.push("");L.push("■搬入・搬出");ld2.forEach(function(x){L.push(x)})}
 var q=[];if(S.conc)q.push("生コン "+S.conc+"m³");if(S.rebar)q.push("鉄筋 "+S.rebar+"kg");
 if(q.length){L.push("");L.push("■数量・進捗");L.push(q.join("／"))}
 if(S.memo){L.push("");L.push("■メモ");L.push(S.memo)}
 
 if(S.tomorrow){L.push("");L.push("■明日の予定");L.push(S.tomorrow)}
 return L.join("\n")}
$("make").onclick=function(){addSite();$("txt").value=build();$("out").hidden=false;$("out").scrollIntoView({behavior:"smooth"})};
$("copy").onclick=function(){var t=$("txt");t.select();var ok=false;try{ok=document.execCommand("copy")}catch(e){}
 if(!ok&&navigator.clipboard){navigator.clipboard.writeText(t.value).then(function(){toast("コピーしました")});return}toast(ok?"コピーしました":"長押しでコピーしてください")};
var PH=[];
function drawPh(){var b=$("phs");b.innerHTML="";PH.forEach(function(p,i){var d=document.createElement("div");d.style.position="relative";var im=document.createElement("img");im.src=p.url;im.style.cssText="width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px";var x=document.createElement("button");x.textContent="✕";x.style.cssText="position:absolute;top:4px;right:4px;width:34px;height:34px;border-radius:50%;border:0;background:rgba(0,0,0,.65);color:#fff";x.onclick=function(){PH.splice(i,1);drawPh()};d.appendChild(im);d.appendChild(x);b.appendChild(d)});$("phn").textContent=PH.length?"（"+PH.length+"枚）":""}
$("pickb").onclick=function(){$("pick").click()};
$("pick").onchange=function(){Array.prototype.forEach.call(this.files,function(f){var rd=new FileReader();rd.onload=function(){var img=new Image();img.onload=function(){var r=Math.min(1,1280/Math.max(img.width,img.height)),c=document.createElement("canvas");c.width=Math.round(img.width*r);c.height=Math.round(img.height*r);c.getContext("2d").drawImage(img,0,0,c.width,c.height);var u=c.toDataURL("image/jpeg",0.75);c.toBlob(function(b){PH.push({blob:b,url:u});drawPh()},"image/jpeg",0.75)};img.src=rd.result};rd.readAsDataURL(f)});this.value=""};
$("line").onclick=function(){var t=$("txt").value,u="https://line.me/R/share?text="+encodeURIComponent(t),w=null;try{w=window.open(u,"_blank")}catch(e){}if(!w){try{location.href=u}catch(e){}}toast("開かない時は「コピー」してLINEに貼り付け")};
$("share").onclick=function(){var t=$("txt").value,d={text:t},fl=PH.map(function(p,i){return new File([p.blob],"genba"+(i+1)+".jpg",{type:"image/jpeg"})});
 if(fl.length&&navigator.canShare&&navigator.canShare({files:fl})){d.files=fl;try{$("txt").select();document.execCommand("copy");toast("文章もコピー済み。文章が出ない時は貼り付け")}catch(e){}}
 if(navigator.share){navigator.share(d).catch(function(){})}else{$("copy").click()}};
function hist(){var h=ld("nippo_hist",[]),b=$("hist");if(!h.length){b.innerHTML='<span style="color:var(--sub);font-size:14px">まだありません</span>';return}
 b.innerHTML="";h.forEach(function(r,i){var d=document.createElement("div");d.className="hi";
 var s=document.createElement("span");s.innerHTML="";s.textContent=fd(r.date)+" "+[].concat(r.weather||[]).join("");var sm=document.createElement("small");sm.textContent=(r.site||"")+"　"+(r.tasks||[]).slice(0,3).join("・");s.appendChild(sm);
 s.style.flex="1";s.onclick=function(){S=Object.assign({},r);draft();fill();$("out").hidden=true;window.scrollTo(0,0);toast("読み込みました")};
 var x=document.createElement("button");x.textContent="🗑️";x.onclick=function(){if(x.dataset.a){h.splice(i,1);sv("nippo_hist",h);hist()}else{x.dataset.a=1;x.textContent="本当に削除";setTimeout(function(){x.dataset.a="";x.textContent="🗑️"},2500)}};
 d.appendChild(s);d.appendChild(x);b.appendChild(d)})}
$("save").onclick=function(){addSite();var h=ld("nippo_hist",[]);h=h.filter(function(r){return !(r.date===S.date&&r.site===S.site)});h.unshift(JSON.parse(JSON.stringify(S)));sv("nippo_hist",h.slice(0,60));hist();toast("保存しました")};
$("new").onclick=function(){PH=[];drawPh();var site=S.site;S={date:today(),site:site,weather:[],start:"07:00",end:"17:00",workers:S.workers,tasks:[],machines:[],veh:[],crew:S.crew,part:{},loads:L0(),conc:"",rebar:"",prog:"",memo:"",hiyari:"",tomorrow:""};draft();fill();$("out").hidden=true;window.scrollTo(0,0)};
var d0=ld("nippo_draft",null);if(d0)S=Object.assign(S,d0);if(!S.date)S.date=today();if(!S.start||S.start==="08:00")S.start="07:00";if(!S.end)S.end="17:00";
fill();hist();
</script>
</body>
</html>
